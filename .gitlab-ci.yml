stages:
  - test
  - audit
  - build
  - scan
  - upload
  - release

# Release process
include:
  - project: "sds-dev/releases"
    ref: main
    file: "releases.yml"

# Make all jobs interruptible by default
default:
  interruptible: true
  image: "${ARTIFACTORY_SERVER}/sds/sdd-common-ci:2026.9.3"


#
# Test stage
#
1-verify:
  stage: test
  tags:
    - sds-test
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - SKIP=test uv tool run pre-commit run --all-files -c .pre-commit-config.yaml --show-diff-on-failure --color never

2-unit-test:
  stage: test
  needs:
    - job: 1-verify
  tags:
    - sds-test
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - "metadata-backend/**/*"
          - "tests/**/*"
          - ".gitlab-ci.yml"
          - ".pre-commit-config.yaml"
          - "pyproject.toml"
          - "tox.ini"
          - "uv.lock"
        compare_to: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
  script:
    - uv tool run pre-commit run test --all-files -c .pre-commit-config.yaml --show-diff-on-failure --color never
    - uv tool run coverage report --precision=1
  coverage: '/TOTAL.*?([\d.]+%)/'

3-integration-test:
  stage: test
  needs:
    - job: 1-verify
  tags:
    - sds-test
  retry: 2
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - "dockerfiles/**/*"
          - "metadata-backend/**/*"
          - "tests/**/*"
          - ".gitlab-ci.yml"
          - "docker-compose.yml"
          - "Makefile"
          - "pyproject.toml"
          - "uv.lock"
        compare_to: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
  variables:
    COMPOSE_PROJECT_NAME: $CI_JOB_ID
    VAULT_ADDR: $VAULT_TEST_ADDR
  before_script:
    # Get secrets from Vault for testing
    - make get_ci_env
  script:
    # Run integration tests with integration-test-runner service in docker-compose
    - docker compose -f docker-compose.yml --env-file tests/integration/.env --profile ci run --build integration-test-runner || export TEST_FAILED=1
    - |
      if [ "$TEST_FAILED" = "1" ]; then
        echo "Tests failed, printing all docker-compose logs:"
        docker compose --env-file tests/integration/.env --profile ci logs
        exit 1
      fi
  after_script:
    # Shut down containers after the tests finish.
    - docker compose --profile ci down -v --remove-orphans


#
# Audit
#
1-python-jf-audit:
  stage: audit
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $GITLAB_USER_NAME != "renovate-bot"'
      variables:
        WATCH: sds-watch
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $GITLAB_USER_NAME == "renovate-bot"'
      variables:
        WATCH: sds-renovate
  before_script:
    - jf config import "${JF_CONFIG_READ_ONLY}"
  script:
    # jf audit does not yet support uv
    - uv export --format requirements.txt --output-file requirements.txt
    - jf audit --pip --extended-table --watches=$WATCH


#
# Build stage
#
1-build-image:
  stage: build
  tags:
    - sds-build
  rules:
    - if: '$CI_COMMIT_TAG'
      variables:
        IMAGE_TAG: $CI_COMMIT_TAG
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        IMAGE_TAG: $CI_COMMIT_REF_SLUG
  variables:
    VAULT_ADDR: $VAULT_TEST_ADDR
    REGISTRY_IMAGE: "${CONTAINER_REGISTRY_ADDRESS}/sds/sd-submit-api:${IMAGE_TAG}"
  before_script:
    - make get_ci_env
  script:
    - echo "Building image sd-submit-api:${IMAGE_TAG}"
    - docker buildx build -t "${REGISTRY_IMAGE}" --iidfile iid.out --secret id=vault_secrets,src=.env -f dockerfiles/Dockerfile .
    - docker push "${REGISTRY_IMAGE}"
    # Save digest as a dotenv artifact
    - echo "IMAGE_DIGEST=$(cat iid.out)" >> build.env
  artifacts:
    reports:
      dotenv: build.env


#
# Scan stage
#
1-scan-image:
  stage: scan
  tags:
    - sds-test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $GITLAB_USER_NAME != "renovate-bot"'
      variables:
        WATCH: sds-watch
        IMAGE_TAG: $CI_COMMIT_REF_SLUG
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $GITLAB_USER_NAME == "renovate-bot"'
      variables:
        WATCH: sds-renovate
        IMAGE_TAG: $CI_COMMIT_REF_SLUG
  variables:
    REGISTRY_IMAGE: "${CONTAINER_REGISTRY_ADDRESS}/sds/sd-submit-api:${IMAGE_TAG}"
  before_script:
    - jf config import "${JF_CONFIG_READ_ONLY}"
  script:
    - docker pull "${REGISTRY_IMAGE}"@${IMAGE_DIGEST}
    - docker tag "${REGISTRY_IMAGE}@${IMAGE_DIGEST}" "${REGISTRY_IMAGE}"
    - jf docker scan --extended-table --watches=$WATCH "${REGISTRY_IMAGE}"


#
# Upload stage
#
1-upload-jfrog-image:
  stage: upload
  tags:
    - sds-upload
  rules:
    - if: '$CI_COMMIT_TAG'
      variables:
        IMAGE_TAG: $CI_COMMIT_TAG
        JFROG_CLI_BUILD_NUMBER: $CI_COMMIT_TAG
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
      variables:
        IMAGE_TAG: $CI_COMMIT_REF_SLUG
        JFROG_CLI_BUILD_NUMBER: $CI_COMMIT_REF_SLUG
  variables:
    REGISTRY_IMAGE: "${CONTAINER_REGISTRY_ADDRESS}/sds/sd-submit-api:${IMAGE_TAG}"
    JFROG_CLI_BUILD_NAME: sd-submit-api
    JFROG_CLI_BUILD_PROJECT: sds
  before_script:
    - jf config import "${JF_CONFIG}"
  script:
    # Push to Artifactory with the same tag as built in the 1-build-image job
    - echo "Pushing image sd-submit-api:${IMAGE_TAG}"
    - docker pull "${REGISTRY_IMAGE}@${IMAGE_DIGEST}"
    - docker tag "${REGISTRY_IMAGE}@${IMAGE_DIGEST}" "${ARTIFACTORY_SERVER}/${REGISTRY_IMAGE#*/}"
    - jf docker push "${ARTIFACTORY_SERVER}/${REGISTRY_IMAGE#*/}"
    - jf rt build-publish

2-upload-ghcr-image:
  stage: upload
  tags:
    - sds-upload
  rules:
    - if: '$CI_COMMIT_TAG'
  variables:
    DOCKER_CONFIG: "$CI_PROJECT_DIR/.docker"
    REGISTRY_IMAGE: "${CONTAINER_REGISTRY_ADDRESS}/sds/sd-submit-api:${CI_COMMIT_TAG}"
  script:
    - |
      echo "This is a release (tag: $CI_COMMIT_TAG)"

      # Pull image from our container registry
      docker pull "${REGISTRY_IMAGE}@${IMAGE_DIGEST}"

      # Login to GitHub Container Registry
      mkdir -p "$DOCKER_CONFIG"
      echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

      # Tag the image for GHCR
      docker tag "${REGISTRY_IMAGE}@${IMAGE_DIGEST}" ghcr.io/cscfi/metadata-submitter:latest
      docker tag "${REGISTRY_IMAGE}@${IMAGE_DIGEST}" ghcr.io/cscfi/metadata-submitter:$CI_COMMIT_SHA
      docker tag "${REGISTRY_IMAGE}@${IMAGE_DIGEST}" ghcr.io/cscfi/metadata-submitter:$CI_COMMIT_TAG

      # Push to GHCR
      echo "Pushing images ghcr.io/cscfi/metadata-submitter:latest"
      docker push ghcr.io/cscfi/metadata-submitter:latest
      echo "Pushing image ghcr.io/cscfi/metadata-submitter:$CI_COMMIT_SHA"
      docker push ghcr.io/cscfi/metadata-submitter:$CI_COMMIT_SHA
      echo "Pushing image ghcr.io/cscfi/metadata-submitter:$CI_COMMIT_TAG"
      docker push ghcr.io/cscfi/metadata-submitter:$CI_COMMIT_TAG

release-job:
  extends: .automated-release
  release:
    description: $(cat release_changes.md)
    assets:
      links:
        - name: "${ARTIFACTORY_SERVER}/sds/sd-submit-api:${RELEASE_VERSION}"
          url: "https://${ARTIFACTORY_SERVER}/artifactory/sds-docker/sds/sd-submit-api/${RELEASE_VERSION}"
          link_type: image

# This is a manual dry-run for developers to run in the merge request
update-versions-dryrun:
  extends: .update-versions-dryrun
  variables:
    UPDATE_VERSION_FILES_LIST: "docs/conf.py;metadata_backend/__init__.py"

# This job updates the versions
update-versions:
  extends: .update-versions
  variables:
    UPDATE_VERSION_FILES_LIST: "docs/conf.py;metadata_backend/__init__.py"
